# ضغط كل فيديو بعد رفعه (تُشغّله دالة api تلقائياً): 720p H.264 · faststart ⇐ تشغيل فوري بلا تقطيع واستهلاك أقل
# الأسرار: R2_ACCOUNT_ID · R2_ACCESS_KEY_ID · R2_SECRET_ACCESS_KEY · R2_BUCKET · ENCODE_SECRET · SUPABASE_URL
name: Encode video
on:
  repository_dispatch:
    types: [video-encode]
concurrency:
  group: enc-${{ github.event.client_payload.id }}
  cancel-in-progress: false
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ID:  ${{ github.event.client_payload.id }}
      RAW: ${{ github.event.client_payload.raw }}
      OUT: ${{ github.event.client_payload.out }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ENCODE_SECRET: ${{ secrets.ENCODE_SECRET }}
      API_URL: ${{ secrets.SUPABASE_URL }}/functions/v1/api
    steps:
      - name: Validate
        run: |
          [[ "$ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::id"; exit 1; }
          [[ "$RAW" =~ ^raw/[0-9a-f-]{36}/[0-9a-f-]{36}\.[a-z0-9]{2,5}$ ]] || { echo "::error::raw"; exit 1; }
          [[ "$OUT" =~ ^v/[0-9a-f-]{36}/[0-9a-f-]{36}$ ]] || { echo "::error::out"; exit 1; }
      - name: FFmpeg
        run: |
          if curl -sfL --max-time 60 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ff.tar.xz; then
            mkdir -p ff && tar -xf ff.tar.xz -C ff --strip-components=1 && sudo mv ff/ffmpeg ff/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
      - name: Encode
        run: |
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "s3://$R2_BUCKET/$RAW" in.bin --endpoint-url "$EP" --only-show-errors
          ffmpeg -hide_banner -loglevel error -y -i in.bin -t 600 \
            -vf "scale='if(gt(iw,ih),-2,min(720,iw))':'if(gt(iw,ih),min(720,ih),-2)':flags=lanczos,fps=fps='min(30,source_fps)'" \
            -c:v libx264 -preset fast -crf 23 -maxrate 2000k -bufsize 4000k -g 60 -keyint_min 30 -profile:v high -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ac 2 -movflags +faststart -map_metadata -1 out.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i out.mp4 -frames:v 1 -q:v 3 poster.jpg \
            || ffmpeg -hide_banner -loglevel error -y -i out.mp4 -frames:v 1 -q:v 3 poster.jpg
          LEN=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4 | cut -d. -f1)
          WH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 out.mp4)
          echo "LEN=${LEN:-0}" >> "$GITHUB_ENV"; echo "SIZE=$(stat -c %s out.mp4)" >> "$GITHUB_ENV"
          echo "W=${WH%%,*}" >> "$GITHUB_ENV"; echo "H=${WH##*,}" >> "$GITHUB_ENV"
          aws s3 cp out.mp4 "s3://$R2_BUCKET/$OUT.mp4" --endpoint-url "$EP" --only-show-errors \
            --content-type video/mp4 --cache-control "public, max-age=31536000, immutable"
          aws s3 cp poster.jpg "s3://$R2_BUCKET/$OUT.jpg" --endpoint-url "$EP" --only-show-errors \
            --content-type image/jpeg --cache-control "public, max-age=31536000, immutable"
      - name: Report
        run: |
          jq -n --arg s "$ENCODE_SECRET" --arg id "$ID" --arg o "$OUT" --argjson len "${LEN:-0}" --argjson size "${SIZE:-0}" \
            --argjson w "${W:-0}" --argjson h "${H:-0}" \
            '{action:"encode_done", secret:$s, id:$id, ok:true, video_key:($o+".mp4"), poster_key:($o+".jpg"), length:$len, size:$size, width:$w, height:$h}' \
          | curl -sf -X POST "$API_URL" -H "Content-Type: application/json" -d @- >/dev/null && echo "✓"
      - name: Report failure
        if: failure()
        run: |
          jq -n --arg s "$ENCODE_SECRET" --arg id "$ID" '{action:"encode_done", secret:$s, id:$id, ok:false}' \
          | curl -s -X POST "$API_URL" -H "Content-Type: application/json" -d @- || true
