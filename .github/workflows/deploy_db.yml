# قاعدة البيانات + دالة api على مشروع Supabase الخاص بالتطبيق
# الأسرار: SUPABASE_ACCESS_TOKEN · SUPABASE_PROJECT_REF · R2_* · (اختياري) GH_ENCODE_TOKEN · ENCODE_SECRET
name: Deploy backend
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy_db.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then echo "::warning::أضف SUPABASE_ACCESS_TOKEN و SUPABASE_PROJECT_REF"; echo "skip=1" >> $GITHUB_OUTPUT; fi
      - name: Apply SQL
        if: steps.chk.outputs.skip != '1'
        run: |
          for f in schema 02_safety 03_promote 04_admin; do
            jq -Rs '{query: .}' "supabase/$f.sql" > /tmp/q.json
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
            if [ "$code" -lt 300 ]; then echo "✓ $f.sql"; else echo "::error::$f.sql ($code)"; head -c 500 /tmp/out.json; exit 1; fi
          done
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.skip != '1'
        with: { version: latest }
      - name: Function secrets
        if: steps.chk.outputs.skip != '1'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          GH_TOKEN: ${{ secrets.GH_ENCODE_TOKEN }}
          ENCODE_SECRET: ${{ secrets.ENCODE_SECRET }}
        run: |
          : > /tmp/s.env
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_URL GH_TOKEN ENCODE_SECRET; do
            v="${!k}"; [ -n "$v" ] && echo "$k=$v" >> /tmp/s.env
          done
          [ -n "$GH_TOKEN" ] && echo "GH_REPO=${{ github.repository }}" >> /tmp/s.env
          [ -s /tmp/s.env ] && supabase secrets set --env-file /tmp/s.env --project-ref "$REF" >/dev/null && echo "✓ secrets"
          rm -f /tmp/s.env
      - name: Deploy api function
        if: steps.chk.outputs.skip != '1'
        run: supabase functions deploy api --project-ref "$REF" --no-verify-jwt
